name: Release

permissions:
  contents: write

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  release:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.VERSION }}
    steps:
      - uses: actions/checkout@v6
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - run: bun test

      - name: Set version
        id: version
        run: |
          VERSION=$(jq -er '.version | select(type == "string")' manifest.json)
          if [[ $GITHUB_REF == refs/tags/* ]]; then
            if [[ "$GITHUB_REF_NAME" != "v$VERSION" ]]; then
              echo "::error::Tag $GITHUB_REF_NAME must match manifest version v$VERSION"
              exit 1
            fi
          fi
          echo "VERSION=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Create Chromium ZIP
        run: |
          zip -r "Linker_${{ steps.version.outputs.VERSION }}.chromium.zip" \
            manifest.json \
            src \
            assets/icon_16.png \
            assets/icon_32.png \
            assets/icon_48.png \
            assets/icon_128.png

      - name: Upload artifacts
        uses: actions/upload-artifact@v6
        with:
          name: Linker-extensions
          path: Linker_${{ steps.version.outputs.VERSION }}.chromium.zip

      - name: Create Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: Linker_${{ steps.version.outputs.VERSION }}.chromium.zip
          generate_release_notes: true

  publish:
    needs: release
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    environment: chrome-web-store
    concurrency: chrome-web-store-release
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v6
        with:
          name: Linker-extensions

      - name: Authenticate to Chrome Web Store
        id: google-auth
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ vars.CWS_WIF_PROVIDER }}
          service_account: ${{ vars.CWS_SERVICE_ACCOUNT }}
          token_format: access_token
          access_token_scopes: https://www.googleapis.com/auth/chromewebstore
          create_credentials_file: false
          export_environment_variables: false

      - name: Upload and submit to Chrome Web Store
        uses: hamzahamidi/publish-to-chrome-web-store@v1.2.2
        with:
          access-token: ${{ steps.google-auth.outputs.access_token }}
          publisher-id: ${{ vars.CWS_PUBLISHER_ID }}
          item-id: nacggecaljkbjoghmiidmkpgpkfpmhgm
          zip: Linker_${{ needs.release.outputs.version }}.chromium.zip
