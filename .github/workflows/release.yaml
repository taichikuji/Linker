name: Release

permissions:
  contents: write

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - run: bun test

      - name: Set version
        id: version
        run: |
          VERSION=$(jq -r .version manifest.json)
          if [[ $GITHUB_REF == refs/tags/* ]]; then
            test "${GITHUB_REF#refs/tags/v}" = "$VERSION"
          fi
          echo "VERSION=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Create Chromium ZIP
        run: |
          zip -r "Linker_${{ steps.version.outputs.VERSION }}.chromium.zip" \
            manifest.json \
            src \
            assets/icon_16.png \
            assets/icon_32.png \
            assets/icon_48.png \
            assets/icon_128.png

      - name: Upload artifacts
        uses: actions/upload-artifact@v6
        with:
          name: Linker-extensions
          path: Linker_${{ steps.version.outputs.VERSION }}.chromium.zip

      - name: Create Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: Linker_${{ steps.version.outputs.VERSION }}.chromium.zip
          generate_release_notes: true
